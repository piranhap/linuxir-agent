<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinuxIR Agent — New Case</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:24px 32px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:20px; letter-spacing:.3px; }
  header p { margin:6px 0 0; color:var(--muted); font-size:13px; }
  .badge { font:11px var(--mono); padding:2px 8px; border-radius:10px;
    border:1px solid var(--border); color:var(--muted); }
  main { max-width:760px; margin:0 auto; padding:28px 24px 64px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:22px 24px; margin-bottom:20px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input, textarea, select { width:100%; background:#0d1117; color:var(--fg);
    border:1px solid var(--border); border-radius:7px; padding:9px 11px; font-size:14px;
    font-family:inherit; }
  textarea { min-height:84px; resize:vertical; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .ev-row { display:flex; gap:8px; margin-bottom:8px; }
  .ev-row input { font-family:var(--mono); font-size:13px; }
  button { cursor:pointer; border:1px solid var(--border); background:#21262d; color:var(--fg);
    border-radius:7px; padding:9px 16px; font-size:14px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button.icon { padding:9px 12px; }
  .actions { margin-top:22px; display:flex; gap:12px; align-items:center; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  #result { display:none; }
  #result.show { display:block; }
  pre { background:#0d1117; border:1px solid var(--border); border-radius:7px; padding:14px;
    overflow:auto; font:12px/1.5 var(--mono); }
  .kv { display:grid; grid-template-columns:160px 1fr; gap:6px 14px; font-size:13px; }
  .kv .k { color:var(--muted); }
  .pill { font:11px var(--mono); padding:2px 8px; border-radius:10px; }
  .pill.local { background:rgba(210,153,34,.15); color:var(--warn); border:1px solid var(--warn); }
  .pill.rest  { background:rgba(63,185,80,.15);  color:var(--ok);   border:1px solid var(--ok); }
  .src-found  { color:var(--ok); }
  .src-missing{ color:var(--warn); }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>LinuxIR Agent <span class="badge">read-only · SIFT</span></h1>
  <p>Open a Linux incident-response case. Provide context and evidence paths; the agent
     investigates without ever modifying evidence.</p>
</header>

<main>
  <div class="card">
    <form id="form">
      <div class="row">
        <div>
          <label for="client_name">Client name *</label>
          <input id="client_name" required placeholder="Acme Corp" />
        </div>
        <div>
          <label for="industry">Industry</label>
          <input id="industry" placeholder="Healthcare" />
        </div>
      </div>

      <label for="suspected_breach_date">Suspected breach date</label>
      <input id="suspected_breach_date" placeholder="2022-03 or 2022-03-14" />

      <label for="context">Case context</label>
      <textarea id="context" placeholder="What prompted the engagement? Symptoms, timeframe, scope..."></textarea>

      <label>Evidence paths * <span class="hint">(mounted image dir, memory capture, log file/dir, or pcap — read-only)</span></label>
      <div id="evidence"></div>
      <button type="button" class="icon" id="addEv">+ add path</button>

      <label for="workspace">Workspace <span class="hint">(optional — defaults to $CASE_DIR/&lt;case_id&gt;)</span></label>
      <input id="workspace" placeholder="./out/my-case" />

      <div class="actions">
        <button type="submit" class="primary" id="submit">Create case</button>
        <span id="obsidian-status" class="hint"></span>
      </div>
    </form>
  </div>

  <div class="card" id="result">
    <h3 style="margin-top:0">Case created</h3>
    <div class="kv" id="result-kv"></div>
    <p style="margin:16px 0 6px;color:var(--muted);font-size:13px">case-state note (verbatim):</p>
    <pre id="result-note"></pre>
    <div class="actions">
      <button id="poll">Refresh status</button>
      <span id="poll-out" class="hint"></span>
    </div>
  </div>
</main>

<script>
const ev = document.getElementById('evidence');
function addEvRow(val='') {
  const row = document.createElement('div');
  row.className = 'ev-row';
  row.innerHTML = `<input type="text" placeholder="/mnt/evidence" value="${val}">
                   <button type="button" class="icon">−</button>`;
  row.querySelector('button').onclick = () => row.remove();
  ev.appendChild(row);
}
addEvRow();
document.getElementById('addEv').onclick = () => addEvRow();

async function refreshObsidian() {
  try {
    const r = await fetch('/healthz'); const j = await r.json();
    const el = document.getElementById('obsidian-status');
    if (j.obsidian_reachable) el.textContent = 'Obsidian REST API: reachable';
    else if (j.obsidian_configured) el.textContent = 'Obsidian configured but unreachable — using local vault';
    else el.textContent = 'Obsidian not configured — notes saved to local vault';
  } catch {}
}
refreshObsidian();

let lastCaseId = null;
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = 'Creating…';
  const paths = [...ev.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
  const payload = {
    client_name: document.getElementById('client_name').value.trim(),
    industry: document.getElementById('industry').value.trim(),
    suspected_breach_date: document.getElementById('suspected_breach_date').value.trim() || null,
    context: document.getElementById('context').value.trim(),
    evidence_paths: paths,
    workspace: document.getElementById('workspace').value.trim() || null,
  };
  try {
    const r = await fetch('/case/new', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const j = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(j.detail || j));
    lastCaseId = j.case_id;
    renderResult(j);
  } catch (err) {
    alert('Error creating case: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Create case';
  }
});

function renderResult(j) {
  const kv = document.getElementById('result-kv');
  const srcHtml = j.sources.map(s =>
    `<span class="${s.exists?'src-found':'src-missing'}">${s.exists?'✓':'⚠'} </span>` +
    `<code>${s.path}</code> <span class="hint">(${s.type})</span>`).join('<br>');
  const pill = `<span class="pill ${j.note.transport}">${j.note.transport}</span>`;
  kv.innerHTML = `
    <div class="k">Case ID</div><div><code>${j.case_id}</code></div>
    <div class="k">Phase</div><div>${j.phase}</div>
    <div class="k">Workspace</div><div><code>${j.workspace}</code></div>
    <div class="k">Evidence</div><div>${srcHtml}</div>
    <div class="k">case-state.md</div><div>${pill} <code>${j.note.path}</code></div>`;
  document.getElementById('result').classList.add('show');
  pollStatus();
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

async function pollStatus() {
  if (!lastCaseId) return;
  const out = document.getElementById('poll-out');
  try {
    const r = await fetch(`/case/${lastCaseId}/status`);
    const j = await r.json();
    document.getElementById('result-note').textContent = JSON.stringify(j, null, 2);
    out.textContent = `phase=${j.phase} · findings=${j.findings_count} · updated ${j.updated_at}`;
  } catch (e) { out.textContent = 'status error'; }
}
document.getElementById('poll').onclick = pollStatus;
</script>
</body>
</html>
